name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional signing secrets. Without them you still get an installable debug APK.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      # Finds the project automatically. Files already in the repo always win;
      # anything missing is filled in from a nested folder or from an archive
      # (.zip, .tar.gz, .tgz, .tar, .7z) uploaded anywhere in the repo.
      - name: Locate project
        shell: bash
        run: |
          set -e
          TMP="$RUNNER_TEMP/unpacked"; mkdir -p "$TMP"

          # 1. unpack every archive found in the repo
          n=0
          while IFS= read -r -d '' a; do
            n=$((n+1)); d="$TMP/$n"; mkdir -p "$d"
            echo "Unpacking $a"
            case "${a,,}" in
              *.zip)            unzip -q -o "$a" -d "$d" || true ;;
              *.tar.gz|*.tgz)   tar -xzf "$a" -C "$d" || true ;;
              *.tar)            tar -xf "$a" -C "$d" || true ;;
              *.7z)             7z x -y -o"$d" "$a" > /dev/null || true ;;
            esac
          done < <(find . -maxdepth 4 -type f \( -iname '*.zip' -o -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.tar' -o -iname '*.7z' \) -not -path './.git/*' -not -path '*/node_modules/*' -print0)

          # 2. copy project files up to the repo root WITHOUT overwriting anything already there
          merge() {
            CFG=$(find "$1" -maxdepth 5 -name capacitor.config.json -not -path '*/node_modules/*' -not -path '*/__MACOSX/*' | head -1)
            if [ -n "$CFG" ]; then
              DIR=$(dirname "$CFG"); echo "Merging project from $DIR"
              cp -an "$DIR"/. . || true
            fi
          }
          # project in a sub-folder of the repo
          if [ ! -f package.json ] || [ ! -f capacitor.config.json ]; then merge .; fi
          # project inside archives
          for d in "$TMP"/*/; do [ -d "$d" ] && merge "$d"; done

          # 3. final check
          if [ ! -f package.json ] || [ ! -d web ]; then
            echo "::error::Project files not found. Upload opener-app.zip (or all project files) to the repo."
            ls -la
            exit 1
          fi
          echo "Project ready:"; ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: node scripts/build-web.js

      - name: Create Android project
        run: npx cap add android

      - name: Customise Android project (manifest, open-with/share, icons, version)
        run: node scripts/prepare-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/Opener-release.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/Opener-release.apk"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Opener-debug.apk
          if [ -f Opener-release.apk ]; then cp Opener-release.apk dist/; fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Opener-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
